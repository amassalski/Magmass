<h2>Magmass</h2>
<p>Instalator zainstaluje program Magmass w folderze <b>Programy</b>.</p>
<p>Na kolejnym ekranie, po licencji, naciśnij <b>Dostosuj</b>, aby wybrać, czy dodać Magmass do <b>Docka</b>.</p>
<p>Program do działania potrzebuje serwera PostgreSQL (lokalnego lub w sieci); połączenie ustawisz przy pierwszym uruchomieniu.</p>
